<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LBT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <h1>Home</h1>
        {% for category, msg in get_flashed_messages(with_categories=true) %}
            <p class="flash flash-{{ category }}">{{ msg }}</p>
        {% endfor %}
        <p><a href="{{ url_for('register') }}">Register</a></p>
    </main>
</body>
</html>
