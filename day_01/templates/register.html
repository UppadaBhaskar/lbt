<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <h1>Register</h1>
        {% for category, msg in get_flashed_messages(with_categories=true) %}
            <p class="flash flash-{{ category }}">{{ msg }}</p>
        {% endfor %}
        <form method="post" action="{{ url_for('register') }}">
            <p>
                <label for="username">Username</label><br>
                <input id="username" name="username" value="{{ username or '' }}" required>
            </p>
            <p>
                <label for="email">Email</label><br>
                <input id="email" name="email" type="email" value="{{ email or '' }}" required>
            </p>
            <p>
                <label for="password">Password</label><br>
                <input id="password" name="password" type="password" required minlength="4">
            </p>
            <p>
                <label for="role">Role</label><br>
                <select id="role" name="role" required>
                    <option value="student" {% if role == 'student' %}selected{% endif %}>Student</option>
                    <option value="teacher" {% if role == 'teacher' %}selected{% endif %}>Teacher</option>
                </select>
            </p>
            <button type="submit">Sign up</button>
        </form>
        <p><a href="{{ url_for('login') }}">Log in</a> · <a href="{{ url_for('home') }}">Home</a></p>
    </main>
</body>
</html>
