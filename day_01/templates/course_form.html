<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>New course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <h1>New course</h1>
        {% for category, msg in get_flashed_messages(with_categories=true) %}
            <p class="flash flash-{{ category }}">{{ msg }}</p>
        {% endfor %}
        <form method="post" action="{{ url_for('course_new') }}">
            <p>
                <label for="title">Title</label><br>
                <input id="title" name="title" value="{{ title or '' }}" required>
            </p>
            <p>
                <label for="description">Description</label><br>
                <textarea id="description" name="description" rows="4" cols="40">{{ description or '' }}</textarea>
            </p>
            <button type="submit">Create</button>
        </form>
        <p><a href="{{ url_for('course_list') }}">All courses</a></p>
    </main>
</body>
</html>
